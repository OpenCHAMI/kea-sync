version: 2
project_name: kea-sync

before:
  hooks:
    - go test ./...

builds:
  - id: kea-sync
    main: ./cmd/kea-sync
    binary: kea-sync
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - "-s -w -X github.com/OpenCHAMI/kea-sync/internal/version.Version={{.Version}} -X github.com/OpenCHAMI/kea-sync/internal/version.GitCommit={{.Commit}} -X github.com/OpenCHAMI/kea-sync/internal/version.BuildTime={{.Date}}"

archives:
  - format: tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"
